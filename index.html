<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DSA Progress Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>DSA PROGRESS</h1>

        <p class="subtitle">
            Track your DSA learning journey
        </p>

        <div id="tracker"></div>

        <div class="divider"></div>

        <div class="overall">
            <h2>
                Overall Progress:
                <span id="overallPercentage">0%</span>
            </h2>

            <p id="overallCompleted">
                0 / 0 completed
            </p>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
